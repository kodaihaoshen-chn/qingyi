name: Windows build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build release executable
        shell: pwsh
        run: .\build.ps1

      - name: Build and run checks
        shell: pwsh
        run: |
          .\build.ps1 -IncludeTests
          .\轻译-测试.exe

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: qingyi-windows-x64
          path: 轻译.exe
